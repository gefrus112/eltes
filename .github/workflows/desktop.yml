name: Build Eltes desktop apps

# Real installers, built on their own OSes:
#   Windows  -> Eltes-Setup-<version>-x64.exe, Eltes-<version>-Portable-x64.exe
#   macOS    -> Eltes-<version>-<arch>.dmg (+ .zip), arm64 and x64
#   Linux    -> Eltes-<version>-linux-x86_64.AppImage, eltes_<version>_amd64.deb
#
# Run it from the Actions tab, or push a tag such as v3.15.0 to attach the
# installers to that GitHub release. Every artifact is unsigned unless the
# signing secrets below are configured.

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release tag to attach the installers to (optional, e.g. v3.15.0)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  # electron-builder caches Electron and its helper binaries between runs
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  windows:
    name: Windows (x64 + arm64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Electron and builder tools
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: desktop-cache-windows-${{ hashFiles('package.json') }}
          restore-keys: desktop-cache-windows-
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify the harness
        shell: bash
        run: |
          set -o pipefail
          node --check desktop/main.js &&
          node --check desktop/shell.js &&
          node --test test/desktop.test.cjs 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Build Windows installers
        shell: bash
        run: |
          set -o pipefail
          npm run desktop:win 2>&1 | tee -a "$RUNNER_TEMP/build.log"
      - name: Report the failure
        if: failure()
        shell: bash
        run: node .github/scripts/report-failure.mjs "$RUNNER_TEMP/build.log"
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: List artifacts
        run: dir desktop\.build\dist
      - uses: actions/upload-artifact@v4
        with:
          name: eltes-windows
          path: |
            desktop/.build/dist/*.exe
            desktop/.build/dist/*.zip
          if-no-files-found: error

  macos-arm64:
    name: macOS (Apple silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Electron and builder tools
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: desktop-cache-macos-arm64-${{ hashFiles('package.json') }}
          restore-keys: desktop-cache-macos-
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build the .dmg and .zip
        shell: bash
        run: |
          set -o pipefail
          node desktop/build.mjs --target=mac --arch=arm64 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Report the failure
        if: failure()
        shell: bash
        run: node .github/scripts/report-failure.mjs "$RUNNER_TEMP/build.log"
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: eltes-macos-arm64
          path: |
            desktop/.build/dist/*.dmg
            desktop/.build/dist/*.zip
          if-no-files-found: error

  macos-x64:
    name: macOS (Intel)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Electron and builder tools
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: desktop-cache-macos-x64-${{ hashFiles('package.json') }}
          restore-keys: desktop-cache-macos-
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build the .dmg and .zip
        shell: bash
        run: |
          set -o pipefail
          node desktop/build.mjs --target=mac --arch=x64 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Report the failure
        if: failure()
        shell: bash
        run: node .github/scripts/report-failure.mjs "$RUNNER_TEMP/build.log"
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: eltes-macos-x64
          path: |
            desktop/.build/dist/*.dmg
            desktop/.build/dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux (AppImage + deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Electron and builder tools
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: desktop-cache-linux-${{ hashFiles('package.json') }}
          restore-keys: desktop-cache-linux-
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify the harness
        shell: bash
        run: |
          set -o pipefail
          node --test test/desktop.test.cjs 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Build AppImage and deb
        shell: bash
        run: |
          set -o pipefail
          npm run desktop:linux 2>&1 | tee -a "$RUNNER_TEMP/build.log"
      - name: Report the failure
        if: failure()
        shell: bash
        run: node .github/scripts/report-failure.mjs "$RUNNER_TEMP/build.log"
      - name: Inspect the packages
        run: |
          ls -lh desktop/.build/dist
          file desktop/.build/dist/*.AppImage || true
      - uses: actions/upload-artifact@v4
        with:
          name: eltes-linux
          path: |
            desktop/.build/dist/*.AppImage
            desktop/.build/dist/*.deb
          if-no-files-found: error

  release:
    name: Attach installers to the release
    needs: [windows, macos-arm64, macos-x64, linux]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the tag
        id: tag
        run: echo "name=${{ inputs.version_tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List what will be published
        run: ls -lh artifacts
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Eltes $TAG" --generate-notes
          fi
          gh release upload "$TAG" artifacts/* --clobber
          # rebuilds must not leave stale asset names behind
          for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
            if [ ! -e "artifacts/$asset" ]; then
              echo "removing stale $asset"
              gh release delete-asset "$TAG" "$asset" --yes
            fi
          done
