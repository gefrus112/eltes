<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Eltes cloud">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="1" stop-color="#02060c"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#6ff7c2"/>
      <stop offset="0.48" stop-color="#39dca2"/>
      <stop offset="1" stop-color="#0fa878"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#39dca2" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#39dca2" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="108" fill="none" stroke="#9ff7d3" stroke-opacity="0.14" stroke-width="2"/>
  <circle cx="256" cy="232" r="190" fill="url(#glow)"/>

  <!-- pixel blocks -->
  <g fill="#39dca2" opacity="0.5">
    <rect x="60" y="86" width="18" height="18" rx="4"/>
    <rect x="90" y="66" width="10" height="10" rx="3" opacity="0.7"/>
    <rect x="424" y="118" width="16" height="16" rx="4"/>
    <rect x="400" y="94" width="9" height="9" rx="2" opacity="0.7"/>
    <rect x="72" y="356" width="12" height="12" rx="3" opacity="0.8"/>
    <rect x="430" y="338" width="18" height="18" rx="4" opacity="0.55"/>
    <rect x="116" y="412" width="9" height="9" rx="2" opacity="0.55"/>
    <rect x="386" y="402" width="12" height="12" rx="3" opacity="0.7"/>
  </g>

  <!-- cloud -->
  <g>
    <path d="M144 354c-45 0-81-35-81-79 0-42 33-77 76-79 8-56 57-98 116-98 60 0 110 43 118 100 43 4 76 39 76 82 0 44-36 74-80 74H144Z"
          fill="#39dca2" opacity="0.28" filter="url(#soft)"/>
    <path d="M144 342c-41 0-73-32-73-72 0-38 30-70 69-72 7-51 52-89 106-89 55 0 100 39 107 91 39 4 69 35 69 74 0 40-33 68-73 68H144Z"
          fill="url(#cloud)"/>
    <path d="M144 342c-41 0-73-32-73-72 0-38 30-70 69-72 7-51 52-89 106-89 55 0 100 39 107 91 39 4 69 35 69 74 0 40-33 68-73 68H144Z"
          fill="none" stroke="#b8ffe3" stroke-opacity="0.35" stroke-width="3"/>

    <!-- winking eye (left) -->
    <path d="M186 262c11 13 29 13 40 0" fill="none" stroke="#052018" stroke-width="11" stroke-linecap="round"/>
    <!-- open eye (right) -->
    <ellipse cx="300" cy="256" rx="24" ry="26" fill="#052018"/>
    <circle cx="309" cy="246" r="8" fill="#d8fff0"/>
    <!-- smile -->
    <path d="M228 300c15 17 41 17 56 0" fill="none" stroke="#052018" stroke-width="11" stroke-linecap="round"/>
  </g>
</svg>
