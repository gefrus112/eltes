<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-label="The Graphite chat theme: neutral grey shell, grey bubbles and grey send button">
  <defs>
    <linearGradient id="thBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0e10"/>
      <stop offset="0.55" stop-color="#0a0b0c"/>
      <stop offset="1" stop-color="#060607"/>
    </linearGradient>
    <linearGradient id="thSend" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#868d99"/>
      <stop offset="1" stop-color="#565d69"/>
    </linearGradient>
    <linearGradient id="thBubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24272c"/>
      <stop offset="1" stop-color="#1a1d21"/>
    </linearGradient>
    <clipPath id="thClip"><rect width="1280" height="760" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#thClip)">
    <rect width="1280" height="760" fill="url(#thBg)"/>

    <!-- sidebar -->
    <rect x="0" y="0" width="300" height="760" fill="#0b0c0d"/>
    <line x1="300" y1="0" x2="300" y2="760" stroke="#1e2024"/>
    <circle cx="30" cy="34" r="10" fill="#39dca2"/>
    <text x="48" y="40" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#ececee">Eltes</text>
    <text x="106" y="40" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6f737b">AI agent</text>
    <rect x="18" y="64" width="264" height="38" rx="9" fill="#17181b" stroke="#2a2c31"/>
    <text x="34" y="88" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#d3d6dc">＋</text>
    <text x="58" y="88" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#c6c9d0">New chat</text>
    <text x="26" y="136" font-family="Inter, system-ui, sans-serif" font-size="9.5" letter-spacing="1.4" fill="#5a5e66">TODAY</text>
    <rect x="12" y="148" width="276" height="30" rx="7" fill="#1c1e22"/>
    <text x="26" y="168" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#e0e3e8">Grey theme review</text>
    <text x="26" y="202" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8f939b">Studio launch notes</text>
    <text x="26" y="230" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8f939b">WebGPU citations</text>
    <text x="26" y="258" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8f939b">Refactor the composer</text>
    <rect x="0" y="700" width="300" height="60" fill="#0d0e10"/>
    <line x1="0" y1="700" x2="300" y2="700" stroke="#1e2024"/>
    <circle cx="30" cy="730" r="13" fill="#24272c"/>
    <text x="30" y="734" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#d3d6dc" text-anchor="middle">L</text>
    <text x="52" y="727" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#c6c9d0">Local workspace</text>
    <text x="52" y="742" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#6f737b">No keys connected</text>

    <!-- top bar -->
    <line x1="300" y1="58" x2="1280" y2="58" stroke="#1e2024"/>
    <rect x="316" y="14" width="200" height="30" rx="8" fill="#141518" stroke="#26282d"/>
    <circle cx="334" cy="29" r="8" fill="#24272c"/>
    <text x="348" y="33" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#e0e3e8">Eltes CAI-1</text>
    <text x="424" y="33" font-family="Inter, system-ui, sans-serif" font-size="9.5" fill="#8f939b">On-device</text>
    <rect x="530" y="18" width="86" height="23" rx="11" fill="#141518" stroke="#26282d"/>
    <text x="544" y="33" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#a8abb2">No keys</text>
    <text x="1050" y="34" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#6f737b">⌘K</text>
    <text x="1100" y="34" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#6f737b">◱</text>
    <text x="1140" y="34" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#6f737b">⚙</text>

    <!-- thread -->
    <text x="700" y="118" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="500" fill="#ececee" text-anchor="middle">What should we <tspan font-style="italic">build</tspan>?</text>
    <text x="700" y="144" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8f939b" text-anchor="middle">Pick a model, connect a key, and search the live web with cited sources.</text>

    <!-- user bubble -->
    <rect x="566" y="192" width="400" height="58" rx="13" fill="url(#thBubble)" stroke="#33363c"/>
    <text x="586" y="216" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#e2e4e8">Make the chat interface grey instead of blue.</text>
    <text x="586" y="236" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#e2e4e8">Keep the green status dots.</text>

    <!-- assistant reply -->
    <circle cx="356" cy="300" r="14" fill="#24272c"/>
    <text x="356" y="305" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#d3d6dc" text-anchor="middle">AI</text>
    <text x="380" y="304" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#c6c9d0">Eltes</text>
    <text x="424" y="304" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#6f737b">just now</text>
    <text x="356" y="336" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#dfe2e6">Done — the whole shell now uses neutral graphite tokens.</text>
    <text x="356" y="360" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#dfe2e6">Accents, bubbles, composer and the send button are grey; the</text>
    <text x="356" y="384" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#dfe2e6">green and red states keep their meaning.</text>
    <rect x="356" y="404" width="420" height="66" rx="11" fill="#111214" stroke="#26282d"/>
    <text x="374" y="428" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#8f939b">--accent-rgb: 158, 163, 173;</text>
    <text x="374" y="446" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#8f939b">--shell-1: #0d0e10;</text>
    <text x="374" y="464" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#8f939b">--bubble-a: #24272c;</text>

    <!-- thinking panel -->
    <rect x="356" y="490" width="420" height="96" rx="11" fill="#111214" stroke="#26282d"/>
    <circle cx="380" cy="516" r="8" fill="#24272c"/>
    <text x="396" y="520" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#d3d6dc">Web search</text>
    <text x="700" y="520" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#8f939b">3 sources · 1.2 s</text>
    <text x="378" y="544" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#a8abb2">Understanding the question</text>
    <text x="720" y="544" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#6f737b">22 ms</text>
    <text x="378" y="562" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#a8abb2">Searching the web · Brave</text>
    <text x="720" y="562" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#6f737b">640 ms</text>
    <text x="378" y="580" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#a8abb2">Writing an answer with citations</text>
    <text x="720" y="580" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#6f737b">9 ms</text>

    <!-- composer -->
    <rect x="340" y="612" width="580" height="98" rx="14" fill="#101113" stroke="#2a2c31"/>
    <text x="360" y="642" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#5f636b">Message Eltes…</text>
    <rect x="356" y="668" width="86" height="26" rx="7" fill="#141518" stroke="#26282d"/>
    <circle cx="372" cy="681" r="6" fill="#24272c"/>
    <text x="384" y="685" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#c6c9d0">CAI-1</text>
    <rect x="452" y="668" width="60" height="26" rx="7" fill="#141518" stroke="#26282d"/>
    <text x="464" y="685" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#a8abb2">Tools</text>
    <rect x="522" y="668" width="72" height="26" rx="7" fill="#16191c" stroke="#3a3d42"/>
    <text x="534" y="685" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#d6dae1">Web on</text>
    <rect x="862" y="666" width="36" height="30" rx="9" fill="url(#thSend)"/>
    <path d="M880 681v-9M875 677l5-5 5 5" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="700" y="734" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#5f636b" text-anchor="middle">Keys and history stay in this browser</text>
  </g>
</svg>
