[package]
name = "eltes-cai"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "The deterministic answer engine behind Eltes CAI — arithmetic, percentages and unit conversion, with an explicit abstention instead of a guess. No network, no model weights, no API key."
license = "MIT"
repository = "https://github.com/gefrus112/eltes"
readme = "README.md"
keywords = ["offline", "deterministic", "calculator", "units", "assistant"]
categories = ["command-line-utilities", "parser-implementations"]

[lib]
name = "eltes_cai"
path = "src/lib.rs"

[[bin]]
name = "cai"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
